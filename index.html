<style>
:root{
  color-scheme:light;
  --surface-0:#f4f3f0; --surface-1:#fcfcfb; --surface-2:#ebeae6;
  --border:#dddbd4; --border-strong:#c3c2b7;
  --text-primary:#0b0b0b; --text-secondary:#52514e; --text-muted:#75746e;
  --accent:#2a78d6; --shadow:0 1px 2px rgba(0,0,0,.06),0 4px 16px rgba(0,0,0,.08);
}
html[data-theme="dark"]{
  color-scheme:dark;
  --surface-0:#121211; --surface-1:#1a1a19; --surface-2:#242422;
  --border:#343431; --border-strong:#4a4a46;
  --text-primary:#ffffff; --text-secondary:#c3c2b7; --text-muted:#8f8e86;
  --accent:#3987e5; --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 16px rgba(0,0,0,.5);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:ui-sans-serif,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--surface-0);color:var(--text-primary);-webkit-font-smoothing:antialiased}
header{background:var(--surface-1);border-bottom:1px solid var(--border);padding:14px 20px 12px;position:relative;z-index:1100}
.hrow{display:flex;align-items:flex-start;gap:20px;flex-wrap:wrap}
h1{font-size:17px;font-weight:650;margin:0;letter-spacing:-.01em}
.sub{font-size:12.5px;color:var(--text-secondary);margin:3px 0 0;line-height:1.45}
.spacer{flex:1 1 auto}
.tiles{display:flex;gap:8px;flex-wrap:wrap}
.tile{background:var(--surface-2);border:1px solid var(--border);border-radius:8px;padding:6px 10px;min-width:100px}
.tile .k{font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--text-muted);font-weight:600}
.tile .v{font-size:16px;font-weight:650;margin-top:2px;font-variant-numeric:tabular-nums;letter-spacing:-.02em;white-space:nowrap}
.controls{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap;padding-top:12px}
.ctl{display:flex;flex-direction:column;gap:5px}
.ctl label{font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--text-muted);font-weight:600}
.seg{display:flex;background:var(--surface-2);border:1px solid var(--border-strong);border-radius:7px;padding:2px;height:31px}
.seg button{border:0;background:transparent;color:var(--text-secondary);font-size:12.5px;font-weight:550;padding:0 9px;white-space:nowrap;border-radius:5px;cursor:pointer;font-family:inherit}
.seg button[aria-pressed="true"]{background:var(--surface-1);color:var(--text-primary);box-shadow:0 1px 2px rgba(0,0,0,.10)}
.seg button:hover{color:var(--text-primary)}
.ms{position:relative}
.msb{display:flex;align-items:center;gap:8px;justify-content:space-between;background:var(--surface-1);color:var(--text-primary);font-family:inherit;border:1px solid var(--border-strong);border-radius:7px;padding:0 9px;font-size:12.5px;height:31px;cursor:pointer;min-width:190px;text-align:left}
.msb .cap{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.msb::after{content:'';flex:none;width:9px;height:6px;background:var(--text-muted);clip-path:polygon(0 0,100% 0,50% 100%)}
.msb[aria-expanded="true"]{border-color:var(--accent);box-shadow:0 0 0 2px rgba(42,120,214,.15)}
.msb .n{flex:none;font-size:10.5px;font-weight:650;color:var(--surface-1);background:var(--accent);border-radius:9px;padding:1px 6px}
.mspanel{position:absolute;top:34px;left:0;z-index:1300;min-width:230px;background:var(--surface-1);border:1px solid var(--border-strong);border-radius:9px;box-shadow:var(--shadow);padding:5px;max-height:290px;overflow:auto}
.mspanel .msopt{display:flex;align-items:center;gap:9px;padding:5px 8px;border-radius:6px;cursor:pointer;white-space:nowrap;user-select:none;font-size:12.5px;font-weight:450;color:var(--text-primary)}
.msopt:hover{background:var(--surface-2)}
.msopt input{accent-color:var(--accent);margin:0;width:14px;height:14px;cursor:pointer}
.msopt .cnt{margin-left:auto;padding-left:14px;color:var(--text-muted);font-size:11px;font-variant-numeric:tabular-nums}
.msfoot{margin-top:5px;padding-top:5px;border-top:1px solid var(--border);display:flex;gap:6px}
.msfoot button{flex:1;background:var(--surface-2);border:1px solid var(--border);border-radius:6px;font-family:inherit;font-size:11.5px;color:var(--text-secondary);padding:4px 0;cursor:pointer}
.msfoot button:hover{color:var(--text-primary)}
.rngwrap{display:flex;align-items:center;gap:9px;height:31px}
input[type=range]{width:130px;accent-color:var(--accent);cursor:pointer}
.rngval{font-size:11.5px;font-variant-numeric:tabular-nums;color:var(--text-secondary);min-width:118px}
.tgl{background:var(--surface-1);border:1px solid var(--border-strong);border-radius:7px;height:31px;padding:0 12px;white-space:nowrap;font-size:12.5px;color:var(--text-secondary);cursor:pointer;font-weight:550;font-family:inherit}
.tgl:hover{color:var(--text-primary)}
#map{position:absolute;top:0;bottom:0;left:0;right:0}
#mapwrap{position:relative;height:calc(100vh - 168px);min-height:420px}
.leaflet-container{background:var(--surface-2);font-family:inherit}
.legend{position:absolute;bottom:20px;right:20px;z-index:1000;background:var(--surface-1);border:1px solid var(--border);border-radius:9px;padding:11px 13px;box-shadow:var(--shadow);width:215px;color:var(--text-primary)}
.legend h4{margin:0 0 7px;font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--text-muted);font-weight:650}
.grad{height:11px;border-radius:3px;border:1px solid var(--border);background:linear-gradient(to right,#006e5a,#ffdd00,#b71c1c)}
.lg-ends{display:flex;justify-content:space-between;font-size:10.5px;color:var(--text-secondary);margin-top:4px}
.lg-vals{display:flex;justify-content:space-between;font-size:10.5px;color:var(--text-secondary);margin-top:4px;font-variant-numeric:tabular-nums}
.lg-note{margin-top:8px;padding-top:7px;border-top:1px solid var(--border);font-size:10px;color:var(--text-muted);line-height:1.5}
.leaflet-popup-content-wrapper{background:var(--surface-1);color:var(--text-primary);border-radius:10px;box-shadow:var(--shadow);border:1px solid var(--border)}
.leaflet-popup-tip{background:var(--surface-1);border:1px solid var(--border)}
.leaflet-popup-content a{color:var(--accent)}
.leaflet-control-zoom a{background:var(--surface-1)!important;color:var(--text-primary)!important;border-color:var(--border)!important}
.leaflet-control-attribution{background:var(--surface-1)!important;color:var(--text-muted)!important;font-size:10px}
.leaflet-control-attribution a{color:var(--text-secondary)!important}
.empty{position:absolute;inset:0;display:none;align-items:center;justify-content:center;pointer-events:none;z-index:500}
.empty span{background:var(--surface-1);border:1px solid var(--border);border-radius:8px;padding:10px 16px;font-size:13px;box-shadow:var(--shadow);color:var(--text-primary)}
.leaflet-draw-toolbar a{background-color:var(--surface-1)!important}
.leaflet-draw-toolbar a:hover{background-color:var(--surface-2)!important}
.leaflet-draw-actions a{background:var(--surface-1)!important;color:var(--text-primary)!important}
.leaflet-draw-actions a:hover{background:var(--surface-2)!important}
.zone-badge{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;color:var(--text-secondary);background:var(--surface-2);border:1px solid var(--border);border-radius:7px;height:31px;padding:0 10px}
.zone-badge b{color:var(--accent);font-weight:650}
.project-star{filter:drop-shadow(0 2px 4px rgba(0,0,0,.45))}
@media (max-width:820px){.tiles{width:100%}.tile{flex:1 1 0;min-width:0}h1{font-size:15px}.msb{min-width:150px}}
</style>
</head>

var BARRIOS = ["Acevedo tejada", "Alhambra", "Balcones del salitre", "Belalcazar", "Bogotá", "Centro administrativo occ.", "Centro narino", "Chico norte", "Chicó Navarra", "Ciudad Montes", "Ciudad Salitre Oriental", "Ciudad salitre", "Ciudad universitaria", "Colseguros", "Corredor ferreo del sur", "Country club", "Cundinamarca", "El Oasis", "El Virrey", "El recuerdo", "Envigado", "Fontibon", "Fusagasugá", "Galerias", "Girardot", "Gorgonzola", "Gran america", "Industrial centenario", "Kennedy Central", "La Guaca", "La esmeralda", "La sabana", "La soledad", "La soledad norte", "Las Villas", "Las americas", "Los ejidos", "Los martires", "Los rosales", "Madelena", "Modelia", "Nicolas de federman", "Panamericano", "Pensilvania", "Puente aranda", "Quesada", "Quinta paredes", "Rafael Nuñez", "Rafael nunez", "Restrepo", "Ricaurte", "Samper mendoza", "San Andresito", "San cristobal norte", "San eusebio", "San francisco", "San luis", "San rafael", "Santa barbara central", "Teusaquillo", "Tocancipá", "Torremolinos", "Usaquen", "Usatama", "Zona industrial"];
var TIPOS = ["Apartamento", "Casa"];
var METRICS = [["ticket","Ticket total"],["m2","Precio / m\u00b2"]];

var state = {
  metric: "ticket",
  tipos: new Set(TIPOS),
  valido: "todos",
  barrios: new Set(BARRIOS),
  maxPricePct: 100,
  polygon: null
};

function pointInPolygon(lat, lng, poly){
  var inside = false;
  for(var i = 0, j = poly.length - 1; i < poly.length; j = i++){
    var yi = poly[i][0], xi = poly[i][1];
    var yj = poly[j][0], xj = poly[j][1];
    var intersect = ((yi > lat) !== (yj > lat)) && (lng < (xj - xi) * (lat - yi) / (yj - yi) + xi);
    if(intersect) inside = !inside;
  }
  return inside;
}

var allPricesSorted = DATA.map(function(d){return d.price;}).sort(function(a,b){return a-b;});

function fmtPrice(n){
  return "$" + Math.round(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ",");
}

function metricVal(d){ return state.metric === "ticket" ? d.price : d.pricem2; }
function metricLabel(){ return state.metric === "ticket" ? "Precio total (COP)" : "Precio por m\u00b2 (COP)"; }
function metricSuffix(){ return state.metric === "ticket" ? "" : "/m\u00b2"; }

function pctToPrice(pct){
  if(pct >= 100) return allPricesSorted[allPricesSorted.length-1];
  var idx = Math.floor((pct/100) * (allPricesSorted.length-1));
  return allPricesSorted[idx];
}

function median(arr){
  var s = arr.slice().sort(function(a,b){return a-b;});
  var n = s.length;
  if(n===0) return 0;
  return n%2===1 ? s[(n-1)/2] : (s[n/2-1]+s[n/2])/2;
}

function hexToRgb(hex){hex=hex.replace('#','');return [parseInt(hex.substr(0,2),16),parseInt(hex.substr(2,2),16),parseInt(hex.substr(4,2),16)];}
function rgbToHex(rgb){return '#'+rgb.map(function(v){return Math.round(v).toString(16).padStart(2,'0');}).join('');}
function lerpColor(c1,c2,t){return [0,1,2].map(function(i){return c1[i]+(c2[i]-c1[i])*t;});}
var GREEN=hexToRgb('006e5a'), YELLOW=hexToRgb('ffdd00'), RED=hexToRgb('b71c1c');
function colorForRank(t){return t<=0.5 ? rgbToHex(lerpColor(GREEN,YELLOW,t/0.5)) : rgbToHex(lerpColor(YELLOW,RED,(t-0.5)/0.5));}

var map = L.map('map', { zoomControl: true });
var lightLayer = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Base/MapServer/tile/{z}/{y}/{x}', {
  maxZoom: 16, attribution: '&copy; Esri &mdash; Esri, DeLorme, NAVTEQ'
});
var darkLayer = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}', {
  maxZoom: 16, attribution: '&copy; Esri &mdash; Esri, DeLorme, NAVTEQ'
});
lightLayer.addTo(map);

var allLatLngs = DATA.map(function(d){return [d.lat,d.lng];});
allLatLngs.push([PROJECT.lat, PROJECT.lng]);
var allBounds = L.latLngBounds(allLatLngs);
map.fitBounds(allBounds, { padding: [30,30] });

var markersLayer = L.layerGroup().addTo(map);

  className: '',

        'fill="#1e40ff" stroke="#ffffff" stroke-width="2"/></svg>',
  iconSize: [40, 40],
  iconAnchor: [20, 24],
  popupAnchor: [0, -20]
});
var projectMarker = L.marker([PROJECT.lat, PROJECT.lng], { icon: starIcon, zIndexOffset: 1000 }).addTo(map);
projectMarker.bindPopup('<strong>' + PROJECT.nombre + '</strong><br>Proyecto en an\u00e1lisis');

var drawnItems = new L.FeatureGroup().addTo(map);
var drawControl = new L.Control.Draw({
  position: 'topleft',
  draw: {
    polygon: { shapeOptions: { color: '#2a78d6', weight: 2, fillOpacity: 0.08 }, allowIntersection: false, showArea: false },
    polyline: false, rectangle: false, circle: false, circlemarker: false, marker: false
  },
  edit: { featureGroup: drawnItems, remove: true }
});
map.addControl(drawControl);

function polygonFromLayer(layer){
  var latlngs = layer.getLatLngs()[0];
  return latlngs.map(function(p){ return [p.lat, p.lng]; });
}

function updateZoneUI(count){
  var badge = document.getElementById('zoneBadge');
  var clearBtn = document.getElementById('clearZoneBtn');
  if(state.polygon){
    badge.innerHTML = 'Zona activa: <b>' + (count !== undefined ? count : applyFilters().length) + '</b> inmuebles';
    clearBtn.style.display = 'inline-block';
  } else {
    badge.textContent = 'Sin zona';
    clearBtn.style.display = 'none';
  }
}

map.on(L.Draw.Event.CREATED, function(e){
  drawnItems.clearLayers();
  drawnItems.addLayer(e.layer);
  state.polygon = polygonFromLayer(e.layer);
  updateZoneUI();
  redraw();
});

map.on(L.Draw.Event.EDITED, function(e){
  e.layers.eachLayer(function(layer){
    state.polygon = polygonFromLayer(layer);
  });
  updateZoneUI();
  redraw();
});

map.on(L.Draw.Event.DELETED, function(){
  state.polygon = null;
  updateZoneUI();
  redraw();
});

document.getElementById('clearZoneBtn').addEventListener('click', function(){
  drawnItems.clearLayers();
  state.polygon = null;
  updateZoneUI();
  redraw();
});

function renderTiles(filtered){
  var vals = filtered.map(metricVal);
  var validCount = filtered.filter(function(d){return d.valido;}).length;
  var suf = metricSuffix();
  var tiles = [
    { k: 'Inmuebles', v: filtered.length },
    { k: 'M\u00ednimo', v: vals.length ? fmtPrice(Math.min.apply(null,vals))+suf : '&mdash;' },
    { k: 'Mediana', v: vals.length ? fmtPrice(median(vals))+suf : '&mdash;' },
    { k: 'M\u00e1ximo', v: vals.length ? fmtPrice(Math.max.apply(null,vals))+suf : '&mdash;' },
    { k: 'V\u00e1lidos', v: filtered.length ? Math.round(100*validCount/filtered.length)+'%' : '&mdash;' }
  ];
  document.getElementById('tiles').innerHTML = tiles.map(function(t){
    return '<div class="tile"><div class="k">'+t.k+'</div><div class="v">'+t.v+'</div></div>';
  }).join('');
}

function renderLegend(filtered){
  var vals = filtered.map(metricVal);
  var suf = metricSuffix();
  var html = '<h4>'+metricLabel()+'</h4><div class="grad"></div>';
  html += '<div class="lg-ends"><span>M\u00e1s barato</span><span>M\u00e1s caro</span></div>';
  if(vals.length){
    html += '<div class="lg-vals"><span>'+fmtPrice(Math.min.apply(null,vals))+suf+'</span><span>'+fmtPrice(median(vals))+suf+'</span><span>'+fmtPrice(Math.max.apply(null,vals))+suf+'</span></div>';
  }
  html += '<div class="lg-note">Color seg\u00fan percentil relativo de la m\u00e9trica seleccionada, dentro del filtro activo.</div>';
  document.getElementById('legend').innerHTML = html;
}

function applyFilters(){
  return DATA.filter(function(d){
    if(!state.tipos.has(d.tipo)) return false;
    if(state.valido === 'valido' && !d.valido) return false;
    if(state.valido === 'novalido' && d.valido) return false;
    if(!state.barrios.has(d.barrio)) return false;
    if(d.price > pctToPrice(state.maxPricePct)) return false;
    if(state.polygon && !pointInPolygon(d.lat, d.lng, state.polygon)) return false;
    return true;
  });
}

function redraw(){
  var filtered = applyFilters();
  markersLayer.clearLayers();

  var sorted = filtered.slice().sort(function(a,b){return metricVal(a)-metricVal(b);});
  var n = sorted.length;
  sorted.forEach(function(d,i){
    var t = n>1 ? i/(n-1) : 0;
    var color = colorForRank(t);
    var marker = L.circleMarker([d.lat, d.lng], {
      radius: 6, fillColor: color, color: '#ffffff', weight: 1.2, opacity: 1, fillOpacity: 0.9
    });
    marker.bindPopup(
      '<strong>'+d.nombre+'</strong><br>'+
      'Ticket: '+d.price_fmt+'<br>'+
      'Precio/m\u00b2: '+d.pricem2_fmt+
      '<br><span style="color:var(--text-muted);font-size:11px">'+d.barrio+' &middot; '+d.tipo+(d.valido?' &middot; V\u00e1lido':' &middot; No v\u00e1lido')+'</span>'+
      '<br><a href="'+d.url+'" target="_blank" rel="noopener">Ver publicaci\u00f3n</a>'
    );
    marker.addTo(markersLayer);
  });

  renderTiles(filtered);
  renderLegend(filtered);
  updateZoneUI(filtered.length);
  document.getElementById('empty').style.display = filtered.length ? 'none' : 'flex';

  var maxP = pctToPrice(state.maxPricePct);
  document.getElementById('priceRangeVal').textContent = state.maxPricePct>=100 ? 'Sin l\u00edmite' : ('hasta '+fmtPrice(maxP));
}

function renderSegMetric(){
  var el = document.getElementById('segMetric');
  el.innerHTML = METRICS.map(function(m){
    return '<button type="button" data-m="'+m[0]+'" aria-pressed="'+(state.metric===m[0])+'">'+m[1]+'</button>';
  }).join('');
  Array.prototype.forEach.call(el.querySelectorAll('button'), function(btn){
    btn.addEventListener('click', function(){
      state.metric = btn.getAttribute('data-m');
      renderSegMetric();
      redraw();
    });
  });
}

function renderSegTipo(){
  var el = document.getElementById('segTipo');
  el.innerHTML = TIPOS.map(function(t){
    return '<button type="button" data-t="'+t+'" aria-pressed="'+(state.tipos.has(t))+'">'+t+'</button>';
  }).join('');
  Array.prototype.forEach.call(el.querySelectorAll('button'), function(btn){
    btn.addEventListener('click', function(){
      var t = btn.getAttribute('data-t');
      if(state.tipos.has(t)){
        if(state.tipos.size>1) state.tipos.delete(t);
      } else {
        state.tipos.add(t);
      }
      renderSegTipo();
      redraw();
    });
  });
}

function renderSegValido(){
  var opts = [['todos','Todos'],['valido','V\u00e1lido'],['novalido','No v\u00e1lido']];
  var el = document.getElementById('segValido');
  el.innerHTML = opts.map(function(o){
    return '<button type="button" data-v="'+o[0]+'" aria-pressed="'+(state.valido===o[0])+'">'+o[1]+'</button>';
  }).join('');
  Array.prototype.forEach.call(el.querySelectorAll('button'), function(btn){
    btn.addEventListener('click', function(){
      state.valido = btn.getAttribute('data-v');
      renderSegValido();
      redraw();
    });
  });
}

var barrioCounts = {};
BARRIOS.forEach(function(b){ barrioCounts[b] = DATA.filter(function(d){return d.barrio===b;}).length; });

function updateMsbCap(){
  var cap = document.getElementById('msbCap');
  if(state.barrios.size === BARRIOS.length){
    cap.textContent = 'Todos los barrios';
  } else if(state.barrios.size === 0){
    cap.textContent = 'Ning\u00fan barrio';
  } else {
    cap.textContent = state.barrios.size + ' barrio(s) seleccionados';
  }
}

function renderMsPanel(){
  var panel = document.getElementById('msPanel');
  var html = BARRIOS.map(function(b){
    var checked = state.barrios.has(b) ? 'checked' : '';
    return '<label class="msopt"><input type="checkbox" data-b="'+b.replace(/"/g,'&quot;')+'" '+checked+'>'+b+'<span class="cnt">'+barrioCounts[b]+'</span></label>';
  }).join('');
  html += '<div class="msfoot"><button type="button" id="msAll">Todos</button><button type="button" id="msNone">Ninguno</button></div>';
  panel.innerHTML = html;

  Array.prototype.forEach.call(panel.querySelectorAll('input[type=checkbox]'), function(cb){
    cb.addEventListener('change', function(){
      var b = cb.getAttribute('data-b');
      if(cb.checked) state.barrios.add(b); else state.barrios.delete(b);
      updateMsbCap();
      redraw();
    });
  });
  document.getElementById('msAll').addEventListener('click', function(){
    state.barrios = new Set(BARRIOS);
    renderMsPanel(); updateMsbCap(); redraw();
  });
  document.getElementById('msNone').addEventListener('click', function(){
    state.barrios = new Set();
    renderMsPanel(); updateMsbCap(); redraw();
  });
}

var msbBtn = document.getElementById('msbBtn');
var msPanel = document.getElementById('msPanel');
msbBtn.addEventListener('click', function(){
  var open = msPanel.style.display !== 'none';
  msPanel.style.display = open ? 'none' : 'block';
  msbBtn.setAttribute('aria-expanded', String(!open));
});
document.addEventListener('click', function(e){
  if(!document.getElementById('msBarrio').contains(e.target)){
    msPanel.style.display = 'none';
    msbBtn.setAttribute('aria-expanded','false');
  }
});

var priceRange = document.getElementById('priceRange');
priceRange.addEventListener('input', function(){
  state.maxPricePct = parseInt(priceRange.value, 10);
  redraw();
});

document.getElementById('resetBtn').addEventListener('click', function(){
  state.metric = 'ticket';
  state.tipos = new Set(TIPOS);
  state.valido = 'todos';
  state.barrios = new Set(BARRIOS);
  state.maxPricePct = 100;
  state.polygon = null;
  drawnItems.clearLayers();
  priceRange.value = 100;
  renderSegMetric(); renderSegTipo(); renderSegValido(); renderMsPanel(); updateMsbCap();
  redraw();
});

var themeBtn = document.getElementById('themeBtn');
themeBtn.addEventListener('click', function(){
  var html = document.documentElement;
  var isDark = html.getAttribute('data-theme') === 'dark';
  if(isDark){
    html.setAttribute('data-theme','light');
    map.removeLayer(darkLayer); lightLayer.addTo(map);
    themeBtn.innerHTML = '&#127769; Oscuro';
  } else {
    html.setAttribute('data-theme','dark');
    map.removeLayer(lightLayer); darkLayer.addTo(map);
    themeBtn.innerHTML = '&#9728;&#65039; Claro';
  }
});

renderSegMetric();
renderSegTipo();
renderSegValido();
renderMsPanel();
updateMsbCap();
redraw();
